# Builds the game and publishes it to GitHub Pages on every push to main.
# Live at: https://nurmuhammedkanybekov.github.io/remnant/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check # typecheck + formatting + tests: never deploy a broken build
      - run: npm run build
        env:
          # Optional: the free co-op relay for networks that block direct
          # connections. Set these under Settings → Secrets and variables →
          # Actions, as Variables or Secrets (see the README). Empty = no relay.
          VITE_METERED_APP: ${{ vars.METERED_APP || secrets.METERED_APP }}
          VITE_METERED_API_KEY: ${{ vars.METERED_API_KEY || secrets.METERED_API_KEY }}
          VITE_TURN_URLS: ${{ vars.TURN_URLS || secrets.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ vars.TURN_USERNAME || secrets.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ vars.TURN_CREDENTIAL || secrets.TURN_CREDENTIAL }}
          # Optional: your own Metered Realtime publishable key for matchmaking (the game ships with one).
          VITE_METERED_REALTIME_KEY: ${{ vars.METERED_REALTIME_KEY || secrets.METERED_REALTIME_KEY }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
