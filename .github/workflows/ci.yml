# Typecheck, formatting, unit tests and a production build on every push and pull request.
name: CI

on:
  push:
    branches-ignore: [main] # main is covered by the deploy workflow
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npx vite build
