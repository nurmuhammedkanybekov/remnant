<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REMNANT</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff5a3c'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Share+Tech+Mono&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: "Share Tech Mono", "Courier New", monospace;
        /* A game, not a page: no text selection, no long-press menus, no dragging images out. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      img,
      canvas {
        -webkit-user-drag: none;
      }
      #app {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      canvas {
        display: block;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #e8e2d6;
        letter-spacing: 6px;
        font-size: 12px;
      }
      #boot .t {
        font-family: "Oswald", "Arial Narrow", Impact, sans-serif;
        font-size: 44px;
        letter-spacing: 0.3em;
        margin-bottom: 18px;
      }
      #boot .bar {
        width: 180px;
        height: 2px;
        margin-top: 16px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #d8432f;
        animation: boot 1.1s ease-in-out infinite;
      }
      #boot .err {
        max-width: 420px;
        margin-top: 20px;
        letter-spacing: 1px;
        line-height: 1.6;
        text-align: center;
        color: #d8432f;
      }
      @keyframes boot {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <div class="t">REMNANT</div>
      <div class="msg">OPENING OBJECT 9</div>
      <div class="bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
